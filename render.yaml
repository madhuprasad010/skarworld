# SKARWORLD REVENUE OS — Render Deployment Blueprint
# https://docs.render.com/blueprint-spec

services:
  # --- Frontend Web Service (Static Site) ---
  - type: web
    name: skarworld-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://skarworld-api.onrender.com/api/v1
      - key: VITE_APP_ENV
        value: production
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- FastAPI Backend Web Service ---
  - type: web
    name: skarworld-api
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skarworld-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: skarworld-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://skarworld-frontend.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: AWS_SES_ACCESS_KEY_ID
        sync: false
      - key: AWS_SES_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SES_REGION
        value: us-east-1
      - key: SES_SENDER_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  # --- Celery Background Worker ---
  - type: worker
    name: skarworld-worker
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && PYTHONPATH=. celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skarworld-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: skarworld-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false

  # --- Celery Beat Scheduler ---
  - type: cron
    name: skarworld-scheduler
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    schedule: "*/5 * * * *"
    startCommand: cd backend && PYTHONPATH=. python -m app.tasks.scheduler
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skarworld-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: skarworld-redis
          type: redis
          property: connectionString

databases:
  - name: skarworld-db
    plan: free
    databaseName: skarworld
    postgresMajorVersion: "16"
